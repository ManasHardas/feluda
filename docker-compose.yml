# Local development only. Credentials below are throwaway values for a database that listens on
# localhost; they are not used anywhere else.
name: neighborhood-watchdog

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchdog
      POSTGRES_PASSWORD: watchdog_local_dev_only
      POSTGRES_DB: watchdog
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdog -d watchdog"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://watchdog:watchdog_local_dev_only@db:5432/postgres
      REQUIRE_DATABASE: "1"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

  migrate:
    build:
      context: ./backend
      target: runtime
    command: ["python", "-m", "watchdog.migrate"]
    environment:
      DATABASE_URL: postgresql://watchdog:watchdog_local_dev_only@db:5432/watchdog
    depends_on:
      db:
        condition: service_healthy
    profiles: ["api"]

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://watchdog:watchdog_local_dev_only@db:5432/watchdog
      ADMIN_API_TOKEN: local-development-admin-token-not-for-production
      PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["api"]

volumes:
  db-data:
