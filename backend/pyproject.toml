[project]
name = "neighborhood-watchdog-backend"
version = "0.1.0"
description = "Backend API, correlation engine and notification service for Neighborhood Watchdog"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "psycopg[binary,pool]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pyjwt[crypto]==2.15.1",
    "httpx[http2]==0.28.1",
    "email-validator==2.4.0",
]

[project.optional-dependencies]
errors = ["sentry-sdk==2.75.0"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --show-capture=no"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
markers = [
    "db: needs a PostgreSQL database (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "B008", "E501", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S603", "S607", "S608"]
"watchdog/simulation/*" = ["S311"]
