name: Release artifacts

# Called by the "Release" workflow. Builds the backend image and the iOS build record from the
# released commit, with software bills of materials (CycloneDX) and build provenance attestations.
# The signed Android APK comes from "Build and distribute Android"; the "Release" workflow attaches
# everything to the GitHub release. Nothing is deployed or distributed from here.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
      - name: Backend SBOM (direct and transitive dependencies from uv.lock)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --format requirements-txt -o requirements.release.txt
          uvx --from cyclonedx-bom==5.1.1 cyclonedx-py requirements requirements.release.txt -o ../sbom-backend.cdx.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ inputs.tag }}
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/backend
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - run: echo "${{ steps.image.outputs.digest }}  ghcr.io/${{ github.repository }}/backend:${{ inputs.tag }}" > backend-image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: |
            sbom-backend.cdx.json
            backend-image-digest.txt


  ios:
    # Compiles the released source and records the toolchain. The signed TestFlight build is produced by
    # "Build and upload iOS".
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build (simulator, unsigned) and record the build environment
        run: |
          xcodebuild -project NeighborhoodWatchdog.xcodeproj -scheme NeighborhoodWatchdog \
            -destination 'generic/platform=iOS Simulator' -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
          { echo "commit: $GITHUB_SHA"; echo "tag: ${{ inputs.tag }}"; xcodebuild -version; swift --version; sw_vers; } > ios-build-info.txt
          echo '{"bomFormat":"CycloneDX","specVersion":"1.5","version":1,"components":[],"metadata":{"component":{"type":"application","name":"neighborhood-watchdog-ios"}}}' > sbom-ios.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            apps/ios/ios-build-info.txt
            apps/ios/sbom-ios.cdx.json
