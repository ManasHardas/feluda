name: Deploy staging

# Staging follows main: every backend change merged into main is deployed to staging, so previews
# and the owner's tests run against it. Production is deployed only by the "Release" workflow.
on:
  push:
    branches: [main]
    paths: ["backend/**", "infrastructure/deployment/fly.staging.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run without credentials
        run: |
          [ -n "$FLY_API_TOKEN" ] || { echo "::error::FLY_API_TOKEN is not configured for this environment"; exit 1; }
          [ -n "$MIGRATION_DATABASE_URL" ] || { echo "::error::MIGRATION_DATABASE_URL is not configured for this environment"; exit 1; }
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
      - name: Apply database migrations
        working-directory: backend
        run: uv sync --frozen --no-dev && DATABASE_URL="$MIGRATION_DATABASE_URL" uv run python -m watchdog.migrate
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy
        run: flyctl deploy backend --config infrastructure/deployment/fly.staging.toml --remote-only
      - name: Smoke test
        run: infrastructure/scripts/smoke_test.sh "${{ vars.STAGING_API_URL }}"
