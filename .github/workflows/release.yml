name: Release

# Runs when the release branch changes, which only happens by merging main into it after the owner
# says so (see docs/RELEASE_PROCESS.md and the "Release guard" check). In order:
#   1. refuse unless VERSION is new and CHANGELOG.md has a section for it,
#   2. migrate and deploy the production backend, then smoke-test it,
#   3. build both apps against production and send them to residents
#      (TestFlight group "Neighbors", submitted for beta review; Firebase group "neighbors"),
#   4. announce the new version to older apps (LATEST_APP_VERSION_*), tag vX.Y.Z and publish a
#      GitHub release with the APK, checksums, SBOMs and provenance.
on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION must be x.y.z, got '$version'"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version was already released. Raise VERSION (and add a CHANGELOG.md section) on main first."; exit 1
          fi
          notes=$(awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md | sed '/./,$!d')
          [ -n "$notes" ] || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
          build=$(( ( $(date -u +%s) - 1767225600 ) / 60 ))
          {
            echo "version=$version"; echo "build=$build"
            echo "notes<<NOTES_END"; echo "$notes" | head -c 3800; echo; echo "NOTES_END"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (build $build)"

  backend:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run without credentials
        run: |
          [ -n "$FLY_API_TOKEN" ] || { echo "::error::FLY_API_TOKEN is not set in the production environment"; exit 1; }
          [ -n "$MIGRATION_DATABASE_URL" ] || { echo "::error::MIGRATION_DATABASE_URL is not set in the production environment"; exit 1; }
          [ -n "${{ vars.PRODUCTION_API_URL }}" ] || { echo "::error::PRODUCTION_API_URL variable is not set"; exit 1; }
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
      - name: Apply database migrations
        working-directory: backend
        run: uv sync --frozen --no-dev && DATABASE_URL="$MIGRATION_DATABASE_URL" uv run python -m watchdog.migrate
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy
        run: flyctl deploy backend --config infrastructure/deployment/fly.production.toml --remote-only
      - name: Smoke test
        run: infrastructure/scripts/smoke_test.sh "${{ vars.PRODUCTION_API_URL }}"

  ios:
    needs: [prepare, backend]
    uses: ./.github/workflows/build-ios.yml
    with:
      ref: ${{ github.sha }}
      api_base_url: ${{ vars.PRODUCTION_API_URL }}
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build }}
      group: Neighbors
      whats_new: ${{ needs.prepare.outputs.notes }}
      submit_review: true
    secrets: inherit

  android:
    needs: [prepare, backend]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-android.yml
    with:
      ref: ${{ github.sha }}
      api_base_url: ${{ vars.PRODUCTION_API_URL }}
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build }}
      groups: neighbors
      notes: ${{ needs.prepare.outputs.notes }}
      artifact_name: android-release
      attest: true
    secrets: inherit

  artifacts:
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      ref: ${{ github.sha }}
      tag: v${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, ios, android, artifacts]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build }}
      NOTES: ${{ needs.prepare.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Tell older apps that a new version exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set --app feluda-production LATEST_APP_VERSION_IOS="$VERSION" LATEST_APP_VERSION_ANDROID="$VERSION"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          printf '%s\n\nBuild %s. iPhone: TestFlight (after Apple'"'"'s beta review for a new version). Android: Firebase App Distribution.\n' "$NOTES" "$BUILD" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Feluda $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
