name: Release artifacts

# Runs when a signed tag such as v0.1.0 is pushed. Builds every artifact from that exact commit, with
# checksums, software bills of materials (CycloneDX) and build provenance attestations, and attaches
# them to a draft GitHub release. Nothing is deployed or distributed from here.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
      - name: Backend SBOM (direct and transitive dependencies from uv.lock)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --format requirements-txt -o requirements.release.txt
          uvx --from cyclonedx-bom==5.1.1 cyclonedx-py requirements requirements.release.txt -o ../sbom-backend.cdx.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/backend
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - run: echo "${{ steps.image.outputs.digest }}  ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}" > backend-image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: |
            sbom-backend.cdx.json
            backend-image-digest.txt

  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: apps/android
    env:
      # Optional. Without them the APK and bundle are built unsigned (still useful for comparing builds).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
      AUTH_PUBLIC_KEY: ${{ vars.AUTH_PUBLIC_KEY }}
      SOURCE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      PRIVACY_URL: ${{ vars.PRIVACY_URL }}
      SECURITY_CONTACT: ${{ vars.SECURITY_CONTACT }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_APPLICATION_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the signing keystore (if configured)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK and bundle
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Android SBOM
        run: ./gradlew --no-daemon cyclonedxBom || echo "::warning::CycloneDX Gradle task not available; see docs/RELEASE_VERIFICATION.md"
      - name: Build metadata and checksums
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android-out"
          find app/build/outputs -name '*.apk' -o -name '*.aab' | xargs -I{} cp {} "$GITHUB_WORKSPACE/android-out/"
          cp build/reports/bom.json "$GITHUB_WORKSPACE/android-out/sbom-android.cdx.json" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/android-out"
          { echo "commit: $GITHUB_SHA"; echo "ref: $GITHUB_REF_NAME"; java -version 2>&1; } > android-build-info.txt
          (cd "$GITHUB_WORKSPACE/apps/android" && ./gradlew --no-daemon --version) >> android-build-info.txt
          sha256sum * > SHA256SUMS-android.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: android-out/*.a*
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android-out/

  ios:
    # Compiles the tagged source and records the toolchain. A signed archive for TestFlight is produced by
    # the separate "Distribute iOS" workflow, because it needs signing credentials.
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Build (simulator, unsigned) and record the build environment
        run: |
          xcodebuild -project NeighborhoodWatchdog.xcodeproj -scheme NeighborhoodWatchdog \
            -destination 'generic/platform=iOS Simulator' -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
          { echo "commit: $GITHUB_SHA"; echo "ref: $GITHUB_REF_NAME"; xcodebuild -version; swift --version; sw_vers; } > ios-build-info.txt
          echo '{"bomFormat":"CycloneDX","specVersion":"1.5","version":1,"components":[],"metadata":{"component":{"type":"application","name":"neighborhood-watchdog-ios"}}}' > sbom-ios.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            apps/ios/ios-build-info.txt
            apps/ios/sbom-ios.cdx.json

  publish:
    needs: [backend, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums for everything attached
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create a draft release with the artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "Draft. Fill in from docs/RELEASE_NOTES_TEMPLATE.md."
