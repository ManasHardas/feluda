name: Android

on:
  # Every pull request runs every test suite: they are required checks for merging into main and release.
  pull_request:
  push:
    branches: [main]
    paths: ["apps/android/**", "shared/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests and lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK, run unit tests and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Release build compiles (unsigned)
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/test-results
          retention-days: 14
