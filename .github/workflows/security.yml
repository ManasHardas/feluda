name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, so newly published advisories are caught without a code change

permissions:
  contents: read

jobs:
  backend-dependencies:
    name: Backend dependency vulnerabilities
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
      - name: Export the locked dependency set
        run: uv export --frozen --no-dev --format requirements-txt -o requirements.audit.txt
      - name: Audit against the PyPI advisory database
        run: uvx --from pip-audit==2.7.3 pip-audit -r requirements.audit.txt --strict --disable-pip

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  dependency-review:
    name: Dependency review (new dependencies in pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: Static analysis (CodeQL, Python)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          source-root: backend
      - uses: github/codeql-action/analyze@v3
