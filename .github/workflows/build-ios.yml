name: Build and upload iOS

# Reusable: called by "Preview build", "Release" and "TestFlight refresh". Builds a signed App Store
# build of the checked-out commit, uploads it to App Store Connect and hands it to TestFlight testers.
# Internal group "Owner" receives every build automatically; residents receive a build only when a
# group is given (the release passes "Neighbors").
on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        type: string
        required: true
      api_base_url:
        type: string
        required: true
      version:
        description: Marketing version (x.y.z)
        type: string
        required: true
      build_number:
        type: string
        required: true
      group:
        description: TestFlight group to add the build to (empty = internal testers only)
        type: string
        default: ""
      whats_new:
        type: string
        default: ""
      submit_review:
        type: boolean
        default: false
    secrets:
      ASC_KEY_ID: { required: true }
      ASC_ISSUER_ID: { required: true }
      ASC_PRIVATE_KEY: { required: true }
      IOS_DISTRIBUTION_P12_BASE64: { required: true }
      IOS_DISTRIBUTION_P12_PASSWORD: { required: true }
      IOS_APP_STORE_PROFILE_BASE64: { required: true }

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Use the newest Xcode on the runner (App Store Connect requires a recent SDK)
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Signing identity and profile in a temporary keychain
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          security find-identity -v -p codesigning "$keychain"
      - name: Archive
        working-directory: apps/ios
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          # xcconfig-style "//" escaping is not needed on the command line.
          xcodebuild archive -project NeighborhoodWatchdog.xcodeproj -scheme NeighborhoodWatchdog -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Feluda.xcarchive" \
            DEVELOPMENT_TEAM="${{ vars.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Feluda App Store" \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ inputs.build_number }}" \
            API_BASE_URL="$API_BASE_URL" PRIVACY_URL="$API_BASE_URL/privacy" \
            SOURCE_REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" SECURITY_CONTACT="${{ vars.SECURITY_CONTACT }}" \
            APNS_ENVIRONMENT=production | tail -40
          test -d "$RUNNER_TEMP/Feluda.xcarchive"
          built_url=$(/usr/libexec/PlistBuddy -c "Print :WatchdogAPIBaseURL" "$RUNNER_TEMP/Feluda.xcarchive/Products/Applications/NeighborhoodWatchdog.app/Info.plist")
          echo "Server address built into the app: $built_url"
          [ "$built_url" = "$API_BASE_URL" ] || { echo "::error::expected $API_BASE_URL"; exit 1; }
      - name: Upload to App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>app.feluda</key><string>Feluda App Store</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Feluda.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Hand the build to TestFlight testers
        env:
          GROUP: ${{ inputs.group }}
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]==2.10.1"
          args=(--version "${{ inputs.version }}" --build "${{ inputs.build_number }}")
          [ -n "$GROUP" ] && args+=(--group "$GROUP")
          [ -n "$WHATS_NEW" ] && args+=(--whats-new "$WHATS_NEW")
          [ "${{ inputs.submit_review }}" = "true" ] && args+=(--submit-review)
          "$RUNNER_TEMP/venv/bin/python" infrastructure/scripts/testflight.py "${args[@]}"
      - name: Remove signing material from the runner
        if: always()
        run: |
          rm -rf ~/.appstoreconnect "$RUNNER_TEMP"/*.mobileprovision
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
