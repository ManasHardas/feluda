name: Distribute Android (Firebase App Distribution)

# Manual, private beta distribution. Needs the secrets and variables listed in docs/APP_DISTRIBUTION.md.
on:
  workflow_dispatch:
    inputs:
      groups:
        description: Firebase tester groups (comma separated)
        default: neighborhood-pilot
      release_notes:
        description: Release notes shown to testers
        required: true

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-24.04
    environment: beta
    defaults:
      run:
        working-directory: apps/android
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SOURCE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      PRIVACY_URL: ${{ vars.PRIVACY_URL }}
      SECURITY_CONTACT: ${{ vars.SECURITY_CONTACT }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_APPLICATION_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run without signing and Firebase credentials
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD API_BASE_URL FIREBASE_APPLICATION_ID; do
            [ -n "${!name}" ] || { echo "::error::$name is not configured"; exit 1; }
          done
          [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ] || { echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not configured"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signed release APK
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase.json
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GROUPS: ${{ inputs.groups }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --global firebase-tools@13.29.1
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          sha256sum "$apk"
          firebase appdistribution:distribute "$apk" --app "$FIREBASE_APPLICATION_ID" --groups "$GROUPS" --release-notes "$NOTES ($GITHUB_SHA)"
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS" "$RUNNER_TEMP/release.jks"
