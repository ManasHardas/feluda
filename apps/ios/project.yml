# XcodeGen spec: the source of truth for NeighborhoodWatchdog.xcodeproj.
# Regenerate with:  xcodegen generate
name: NeighborhoodWatchdog
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  NeighborhoodWatchdog:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: NeighborhoodWatchdog
        excludes:
          - Info.plist
          - Info-Debug.plist
          - NeighborhoodWatchdog.entitlements
      - path: NeighborhoodWatchdog/Info.plist
        buildPhase: none
      - path: NeighborhoodWatchdog/Info-Debug.plist
        buildPhase: none
      - path: NeighborhoodWatchdog/NeighborhoodWatchdog.entitlements
        buildPhase: none
      - path: Config
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: NeighborhoodWatchdog
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NeighborhoodWatchdog/NeighborhoodWatchdog.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        # Debug uses a copy of Info.plist with one addition: an ATS exception for localhost.
        # Release has no ATS exceptions. See scripts/make-debug-plist.sh.
        Debug:
          INFOPLIST_FILE: NeighborhoodWatchdog/Info-Debug.plist
        Release:
          INFOPLIST_FILE: NeighborhoodWatchdog/Info.plist
  NeighborhoodWatchdogTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NeighborhoodWatchdogTests
    dependencies:
      - target: NeighborhoodWatchdog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.manashardas.feluda.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NeighborhoodWatchdog.app/NeighborhoodWatchdog
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
schemes:
  NeighborhoodWatchdog:
    build:
      targets:
        NeighborhoodWatchdog: all
        NeighborhoodWatchdogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeighborhoodWatchdogTests
    archive:
      config: Release
