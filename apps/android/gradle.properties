org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Compile Kotlin inside the Gradle process: no separate Kotlin daemon is left running.
kotlin.compiler.execution.strategy=in-process

# Build configuration (no secrets). Override with -PKEY=value, ~/.gradle/gradle.properties or an
# environment variable of the same name. See README.md for the full list.
# APPLICATION_ID=app.feluda
